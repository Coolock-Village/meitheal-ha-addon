name: "Meitheal Canary"
version: "fec6e08e09f3"
breaking_versions:
  - "fec6e08e09f3"
slug: "meitheal_canary"
description: "Preview channel for Meitheal — test upcoming household task, routine, project, and Home Assistant automation features before stable release."
url: "https://github.com/ryan-winkler/meitheal-ha-addon"
github: "ryan-winkler/meitheal-ha-addon"
docs_url: "https://github.com/ryan-winkler/meitheal-ha-addon/tree/main/meitheal-hub-canary/DOCS.md"
image: "ghcr.io/coolock-village/meitheal-canary-{arch}"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 3000
ingress_entry: /
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - meitheal
panel_icon: mdi:flask-outline
panel_title: "Meitheal Canary"
panel_admin: false
apparmor: true
tmpfs: true
watchdog: http://[HOST]:[PORT:3000]/api/health
backup: cold
backup_exclude:
  - "*.log"
  - "*.tmp"
stage: experimental
options:
  log_level: info
  log_categories:
    - auth
    - tasks
    - integrations
    - observability
  log_redaction: true
  audit_enabled: true
  loki_url: ""
  license_key: ""
schema:
  log_level: list(debug|info|warn|error)
  log_categories:
    - str
  log_redaction: bool
  audit_enabled: bool
  loki_url: str
  license_key: "str?"
